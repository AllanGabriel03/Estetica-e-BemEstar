<div class="pagina">
  <div class="cartao" id="login">
    <h2>Entrar</h2>
    <p class="dica">
      Informe o CPF cadastrado para acessar seus pedidos.
    </p>

    <form [formGroup]="form" (ngSubmit)="salvar()">
      <div class="campo">
        <label for="cpf">CPF</label>
        <input
          id="cpf"
          type="text"
          inputmode="numeric"
          maxlength="11"
          formControlName="cpf"
          placeholder="Somente numeros"
        />
        @if (campoInvalido('cpf')) {
          <small class="erro">O CPF deve ter 11 numeros.</small>
        }
      </div>

      @if (erro()) {
        <div class="msg-erro">{{ erro() }}</div>
      }

      <div class="acoes">
        <button type="submit" [disabled]="carregando()">
          {{ carregando() ? 'Entrando...' : 'Entrar' }}
        </button>
      </div>
    </form>

    <p class="dica">
      Ainda nao tem cadastro?
      <a routerLink="/cadastro">Cadastre-se</a>
    </p>
  </div>
</div>
